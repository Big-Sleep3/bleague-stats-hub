name: Update University Kanto D2 Official Stats
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_college_kanto2.py'
      - 'tests/test_college_kanto2.py'
      - '.github/workflows/update-college-kanto2.yml'
  schedule:
    - cron: '22,52 8-16 * * *'
    - cron: '25 4 * * *'
permissions:
  contents: write
concurrency:
  group: college-kanto2-update
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Validate official source parser
        run: python -m unittest discover -s tests -p 'test_college_kanto2.py' -v
      - name: Import official verified 2026 D2 statistics
        run: python scripts/update_college_kanto2.py
      - name: Commit validated player data only
        run: |
          if git diff --quiet -- recruiting/players-kanto2.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recruiting/players-kanto2.json
          git commit -m 'data: update verified Kanto D2 player stats'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Verified data published"
              exit 0
            fi
            echo "Concurrent repository update; retry $attempt"
            sleep 3
          done
          echo "Unable to publish after retries" >&2
          exit 1
