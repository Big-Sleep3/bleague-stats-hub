name: B.LEAGUE Contract Hub Browser Tests
on:
  push:
    paths:
      - 'contracts/**'
      - 'tests/test_contracts_browser.py'
      - '.github/workflows/test-contracts-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Verify public contract data structure
        run: python scripts/validate_bleague_contracts.py
      - name: Test source-proof rules
        run: python -m unittest discover -s tests -p 'test_contract_validation.py' -v
      - run: python -m unittest discover -s tests -p 'test_contracts_browser.py' -v
