name: Update B.PREMIER Stats
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/auto-update.yml'
  workflow_dispatch:
  schedule:
    - cron: '18 1,8,13 * * *'
permissions:
  contents: write
concurrency:
  group: stats-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and parser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate official statistics
        id: fetch
        continue-on-error: true
        run: python scripts/update_stats.py
      - name: Commit successful data and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stats.json data/sync-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh B.PREMIER stats and sync status'
            git push
          fi
      - name: Fail workflow when all sources fail
        if: steps.fetch.outcome == 'failure'
        run: exit 1
