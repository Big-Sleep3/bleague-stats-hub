name: Update College Recruiting (public stats only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_college_recruiting.py'
      - 'tests/test_college_recruiting.py'
      - '.github/workflows/update-college-recruiting.yml'
  schedule:
    # UTC 08:17-16:47 corresponds to JST 17:17-01:47.
    - cron: '17,47 8-16 * * *'
    - cron: '17 4 * * *'
permissions:
  contents: write
concurrency:
  group: college-recruiting-update
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Test parsing and data safeguards
        run: python -m unittest discover -s tests -p 'test_college_recruiting.py' -v
      - name: Read verified official statistics
        run: python scripts/update_college_recruiting.py
      - name: Commit only when official stats changed
        run: |
          if git diff --quiet -- recruiting/players.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recruiting/players.json
          git commit -m 'data: refresh verified college stats'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Verified official data published"
              exit 0
            fi
            echo "Concurrent update, retry $attempt"
            sleep 3
          done
          exit 1
