name: Enrich College Recruiting Player Physical Profiles
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_recruiting_physical.py'
      - 'recruiting/physical-sources.json'
      - 'tests/test_recruiting_physical.py'
      - '.github/workflows/update-recruiting-physical.yml'
  schedule:
    # Once daily, 03:07 Japan time.
    - cron: '7 18 * * *'
permissions:
  contents: write
concurrency:
  group: university-recruiting-physical
  cancel-in-progress: false
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Test identity matching and source precedence
        run: python -m unittest discover -s tests -p 'test_recruiting_physical.py' -v
      - name: Update verified roster profiles only
        run: python scripts/update_recruiting_physical.py
      - name: Publish when evidence changed
        run: |
          if git diff --quiet -- recruiting/physical-profiles.json; then
            echo "No verified profile changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recruiting/physical-profiles.json
          git commit -m 'data: update verified college player profiles'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Verified physical profiles published"
              exit 0
            fi
            sleep 3
          done
          exit 1
