name: Verify defensive metrics
on:
  push:
    branches:
      - feature/defensive-stats
    paths:
      - 'scripts/defensive_stats.py'
      - 'tests/test_defensive_stats.py'
      - 'advanced-lab.html'
      - 'tests/test_advanced_lab_ui.py'
      - 'tests/test_advanced_browser.py'
      - '.github/workflows/test-defensive-stats.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test verified opponent BOX SCORE calculations
        run: |
          python -m unittest discover -s tests -p 'test_defensive_stats.py' -v
          python -m unittest discover -s tests -p 'test_advanced_lab_ui.py' -v
      - name: Install browser for smoke test
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify browser rendering, filters and CSV
        run: python -m unittest discover -s tests -p 'test_advanced_browser.py' -v
