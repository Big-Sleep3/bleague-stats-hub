<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B.PREMIER STATS HUB | DEFENSE LAB</title><style>
:root{--navy:#132a3d;--teal:#067a83;--line:#d9e5e9;--muted:#607788}*{box-sizing:border-box}
body{background:#f1f6f8;color:var(--navy);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;margin:0}
header{background:linear-gradient(110deg,#102638,#1b5361);padding:25px max(20px,calc((100vw - 1460px)/2));color:#fff}
header small{letter-spacing:.15em;color:#bfdee0}h1{margin:7px 0;font-size:clamp(27px,3vw,38px)}header p{color:#cfe3e6}
main{max-width:1470px;margin:auto;padding:18px}
nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
nav a{background:#fff;color:#183546;padding:9px 13px;border-radius:8px;text-decoration:none;border:1px solid var(--line);font-weight:700}
button,input,select{font:inherit;border:1px solid #bfd0d8;border-radius:8px;padding:9px;background:#fff;color:inherit}
button{cursor:pointer;font-weight:700}button[aria-pressed=true]{background:#173a4b;color:#fff;border-color:#173a4b}
section{border:1px solid var(--line);background:#fff;border-radius:12px;padding:18px;margin-bottom:16px}
h2{font-size:19px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:18px 0}
.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700;color:var(--muted)}
input{min-width:190px}.spacer{flex:1}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:1190px;font-variant-numeric:tabular-nums}
th{background:#e7f1f3;color:#294b5b;font-size:12px;white-space:nowrap;text-align:right;padding:12px 9px;border-bottom:1px solid var(--line)}
th:first-child,th:nth-child(2){text-align:left}th button{background:none;border:0;padding:0;font-size:12px;font-weight:700}
td{text-align:right;padding:12px 9px;white-space:nowrap;border-bottom:1px solid #edf1f3}
td:first-child,td:nth-child(2){text-align:left}td:nth-child(2){font-weight:700}
tr:hover td{background:#f6fbfc}.unknown{color:#9aaab0}.partial{color:#946222}.ok{color:#0e766c}
.note{background:#f4f8f9;border-left:3px solid #7baeb7;padding:13px;font-size:13px;color:#425f70}
@media(max-width:650px){section{padding:12px}.field{flex:1 1 42%}.field input,.field select{width:100%;min-width:0}}
</style></head><body>
<header><small>◈ BASKETBALL STATS LAB / 2026–27</small><h1>DEFENSE LAB</h1><p id="tagline">相手に何を許しているか。26クラブの守備指標を比較。</p></header>
<main><nav><a href="index.html">← STATS HUB</a><button id="ja" aria-pressed="true">日本語</button><button id="en" aria-pressed="false">English</button></nav>
<section><div class="top"><div><h2 id="heading">相手スタッツ｜26クラブ</h2><div id="summary" class="muted">読み込み中…</div></div><span id="health" class="ok">公式データ読み込み中…</span></div>
<div class="controls"><div class="field"><label for="search" id="findlabel">クラブ検索</label><input id="search" type="search" placeholder="信州 / 千葉"></div>
<div class="field"><label for="sort" id="sortlabel">並べ替える指標</label><select id="sort"></select></div>
<div class="field"><label id="modelabel">表示形式</label><div><button id="avg" aria-pressed="true">平均</button><button id="total" aria-pressed="false">合計</button></div></div>
<div class="spacer"></div><button id="export">CSV ↓</button></div>
<div class="scroll"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div>
<p id="coverageNote" class="muted"></p></section>
<section><h2 id="sourceHeading">出典と集計条件</h2><p class="note" id="sourceNote"></p>
<p id="stamp" class="muted"></p><a href="https://www.bleague.jp/schedule/" target="_blank" rel="noopener">B.LEAGUE 公式日程・BOX SCORE</a></section></main>
<script>
"use strict";
var fields=[
["opp_pts","相手得点","Opp PTS","num",0],
["opp_2p_pct","相手2P%","Opp 2P%","pct",0],
["opp_3p_pct","相手3P%","Opp 3P%","pct",0],
["opp_efg_pct","相手eFG%","Opp eFG%","pct",0],
["opp_tov_pct","相手TOV%","Opp TOV%","pct",1],
["opp_oreb_pct","被ORB%","Opp ORB%","pct",0],
["opp_oreb","被ORB","Opp ORB","num",0],
["opp_second_chance_pts","被2nd Chance PTS","Opp 2nd Chance PTS","num",0],
["opp_2pa","相手2PA","Opp 2PA","num",0],
["opp_3pa","相手3PA","Opp 3PA","num",0]];
var data=null,lang="ja",mode="avg",order="opp_oreb_pct",filter="";
var enNames={"信州":"Shinshu","千葉J":"Chiba Jets","A東京":"Alvark Tokyo","東京SR":"Sunrockers","群馬":"Gunma","宇都宮":"Utsunomiya","三遠":"San-en","三河":"Mikawa","名古屋D":"Nagoya D","京都":"Kyoto","琉球":"Ryukyu","広島":"Hiroshima","島根":"Shimane","長崎":"Nagasaki","北海道":"Hokkaido","仙台":"Sendai","秋田":"Akita","茨城":"Ibaraki","富山":"Toyama","川崎":"Kawasaki","横浜BC":"Yokohama","A千葉":"Altiri Chiba","滋賀":"Shiga","大阪":"Osaka","神戸":"Kobe","佐賀":"Saga"};
function el(id){return document.getElementById(id)}
function t(ja,en){return lang==="ja"?ja:en}
function name(r){return lang==="ja"?r.name:(enNames[r.abbr]||r.abbr)}
function fName(f){return f[lang==="ja"?1:2]}
function value(r,key){if(!r.metrics)return null;var v=r.metrics[key];if(v==null)return null;var f=fields.find(function(x){return x[0]===key});if(mode==="avg"&&f&&f[3]==="num"){var explicit=r.metrics[key+"_pg"];return explicit!=null?explicit:(r.gp>0?v/r.gp:null)}return v}
function format(v,type){return v==null?"—":type==="pct"?(100*v).toFixed(1)+"%":v.toFixed(1)}
function valid(r){return r.complete&&value(r,order)!=null}
function visible(){
var set=(data?data.clubs:[]).slice();
var chosen=fields.find(function(f){return f[0]===order});
set.sort(function(a,b){if(valid(a)!==valid(b))return valid(a)?-1:1;var av=value(a,order),bv=value(b,order);if(av!=null&&bv!=null&&av!==bv)return chosen[4]?bv-av:av-bv;return a.abbr.localeCompare(b.abbr,"ja")});
var leagueRank=0;set.forEach(function(r){r._defenseRank=valid(r)?++leagueRank:null});
return set.filter(function(r){return!filter||(r.name+" "+r.abbr+" "+(enNames[r.abbr]||"")).toLowerCase().indexOf(filter.toLowerCase())>=0});
}
function cell(tag,text,cls){var x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;return x}
function render(){
var english=lang==="en";document.documentElement.lang=lang;
el("ja").setAttribute("aria-pressed",String(!english));el("en").setAttribute("aria-pressed",String(english));
el("tagline").textContent=t("相手に何を許しているか。26クラブの守備指標を比較。","What are opponents getting? Verified defensive stats for 26 clubs.");
el("heading").textContent=t("相手スタッツ｜26クラブ","Opponent defense | 26 clubs");
el("findlabel").textContent=t("クラブ検索","Find club");el("sortlabel").textContent=t("並べ替える指標","Sort by");
el("modelabel").textContent=t("表示形式","View");el("avg").textContent=t("平均","Per game");el("total").textContent=t("合計","Totals");
el("sourceHeading").textContent=t("出典と集計条件","Sources and methodology");
el("sourceNote").textContent=t("B.LEAGUE公式の試合別サマリー（試合全体・PeriodCategory=18）を使用。被ORB%＝相手ORB÷（相手ORB＋自チームDREB）。被2nd Chance PTS＝相手PT2NDの合計。全試合を照合したクラブのみ順位対象。未取得値は0ではなくN/A。","Based on the official B.LEAGUE full-game Summaries. Opp ORB% = Opp ORB / (Opp ORB + own DREB). Opp 2nd Chance PTS = official opponent PT2ND totals. Only fully verified clubs are ranked; missing values are N/A.");
el("avg").setAttribute("aria-pressed",String(mode==="avg"));el("total").setAttribute("aria-pressed",String(mode==="total"));
var options=fields.map(function(f){var o=document.createElement("option");o.value=f[0];o.textContent=fName(f);o.selected=(f[0]===order);return o});el("sort").replaceChildren.apply(el("sort"),options);
var thead=el("head");thead.replaceChildren(cell("th",t("順位","Rank")),cell("th",t("クラブ","Club")),cell("th","GP"));
fields.forEach(function(f){var th=document.createElement("th"),b=document.createElement("button");b.type="button";b.textContent=fName(f);b.title=t("クリックで並び替え","Click to sort");b.addEventListener("click",function(){order=f[0];render()});th.appendChild(b);thead.appendChild(th)});
if(!data){el("summary").textContent=t("公式ゲームデータ取得中…","Loading verified official game data…");return}
var n=data.clubs.filter(function(r){return r.complete}).length;
el("summary").textContent=n+"/26 "+t("クラブの全試合照合が完了","clubs with complete verified coverage");
el("health").textContent=data.clubs.some(function(r){return r.gp>0})?t("公式ゲームデータ","Official game data"):t("公式試合の照合待ち","Awaiting verified game data");
el("stamp").textContent=t("公式掲載日時：未提供 ／ 取得・集計日時：","Official publication: not supplied / Retrieved and aggregated: ")+(data.updated_at||"—");
el("coverageNote").textContent=t("順位は全試合照合済みのみ。暫定値は参考表示、未確認値は—。","Only clubs with complete coverage receive ranks. Partial values are provisional; unknown values show —.");
var tbody=el("rows");tbody.replaceChildren();
visible().forEach(function(r){var tr=document.createElement("tr");tr.appendChild(cell("td",r._defenseRank?String(r._defenseRank):"—",valid(r)?"ok":"unknown"));
tr.appendChild(cell("td",name(r)));tr.appendChild(cell("td",r.gp+"/"+r.expected_gp,r.complete?"ok":"partial"));
fields.forEach(function(f){var v=value(r,f[0]);var td=cell("td",format(v,f[3]),v==null?"unknown":r.complete?"":"partial");if(!r.complete&&v!=null)td.title=t("一部試合のみの参考値","Partial sample only");tr.appendChild(td)});tbody.appendChild(tr)});
if(!tbody.children.length){var r=document.createElement("tr"),td=cell("td",t("該当クラブなし","No matching clubs"));td.colSpan=fields.length+3;r.appendChild(td);tbody.appendChild(r)}
}
function saveCSV(){if(!data)return;var lines=[[t("順位","Rank"),t("クラブ","Club"),"Verified GP","Expected GP"].concat(fields.map(fName))];visible().forEach(function(r){lines.push([r._defenseRank||"",name(r),r.gp,r.expected_gp].concat(fields.map(function(f){var v=value(r,f[0]);return v==null?"":(f[3]==="pct"?v*100:v).toFixed(2)})))});
var csv="\uFEFF"+lines.map(function(row){return row.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");
var url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="bleague-defense-2026-27.csv";a.click();URL.revokeObjectURL(url)}
el("ja").addEventListener("click",function(){lang="ja";render()});el("en").addEventListener("click",function(){lang="en";render()});
el("avg").addEventListener("click",function(){mode="avg";render()});el("total").addEventListener("click",function(){mode="total";render()});
el("sort").addEventListener("change",function(e){order=e.target.value;render()});el("search").addEventListener("input",function(e){filter=e.target.value;render()});el("export").addEventListener("click",saveCSV);
render();fetch("data/defense.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(function(d){if(!Array.isArray(d.clubs)||d.clubs.length!==26)throw Error("Expected 26 clubs");data=d;render()}).catch(function(e){el("health").textContent="N/A";el("summary").textContent=t("公式DEFENSEデータの取得に失敗","Could not verify official defense data");console.error(e)});
</script></body></html>
